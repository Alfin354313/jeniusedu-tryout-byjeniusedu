<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0965ef"><meta name="description" content="Jenius Tryout by Jenius Edu — persiapan ujian SD, SMP, SMA, UTBK/SNBT, CPNS, Kedinasan dan MTsN/MAN."><title>Detail Tryout | Jenius Tryout</title><link rel="stylesheet" href="css/style.css"><style>/* Detail Tryout: distinct package overview and session timeline */
body[data-page="detail"] .jt-section-head{display:flex;align-items:center;gap:14px;margin-bottom:22px}
