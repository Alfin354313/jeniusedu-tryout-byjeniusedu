<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Struk Pesanan | Jenius Tryout</title><style>body{font:15px/1.6 system-ui;background:#f3f7fe;color:#10305f;margin:0;padding:30px 15px}.receipt{max-width:660px;margin:auto;background:white;border:1px solid #dce6f6;border-radius:18px;padding:30px;box-shadow:0 15px 40px #133c7310}h1{margin:0 0 6px}h2{font-size:17px}.line{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid #e7edf8}.line strong{text-align:right}.total{font-size:22px;color:#0863d8}.notice{padding:13px;background:#f0f6ff;border-radius:9px;margin:20px 0}.btn{display:inline-block;background:#0967e9;color:white;padding:12px 16px;border-radius:9px;border:0;cursor:pointer;text-decoration:none;font:inherit}.actions{display:flex;gap:10px;flex-wrap:wrap}input{max-width:100%}@media print{body{background:white;padding:0}.receipt{border:0;box-shadow:none}.actions,form{display:none}}</style></head><body><main class="receipt"><div style="font-weight:800;color:#0863d8">JENIUS EDU · JENIUS TRYOUT</div><h1>Struk Konfirmasi Pesanan</h1><p id="state">Memuat pesanan...</p><section id="detail" hidden><div class="line"><span>No. pesanan</span><strong id="orderId"></strong></div><div class="line"><span>Tanggal</span><strong id="created"></strong></div><div class="line"><span>Paket</span><strong id="exam"></strong></div><div class="line"><span>Harga</span><strong id="subtotal"></strong></div><div class="line"><span>Diskon</span><strong id="discount"></strong></div><div class="line"><span>Administrasi</span><strong id="fee"></strong></div><div class="line total"><span>Total</span><strong id="total"></strong></div><div class="notice" id="notice"></div><form id="proofForm" hidden><h2>Konfirmasi Transfer BCA</h2><p>Transfer ke BCA 4120418420 a.n. Muhammad Alfi, lalu unggah bukti pembayaran (JPG, PNG, atau PDF, maksimal 5 MB).</p><input type="file" id="proof" accept="image/jpeg,image/png,application/pdf" required><button class="btn" type="submit">Kirim Bukti Transfer</button><p id="feedback" role="status"></p></form><div class="actions"><button type="button" class="btn" onclick="window.print()">Cetak / Simpan PDF</button><a class="btn" href="dashboard.html">Akun Peserta</a></div></section></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const db=createClient('https://emcchkpdgwkjovdylcth.supabase.co','sb_publishable_S_c2Lqt84z8XOgq6btW60g_Fz3rhrCe'),$=id=>document.getElementById(id),money=n=>'Rp'+Number(n).toLocaleString('id-ID');
const orderId=new URLSearchParams(location.search).get('order'),{data:{session}}=await db.auth.getSession();if(!session){location.replace('login.html');}else if(!/^[0-9a-f-]{36}$/i.test(orderId||''))$('state').textContent='Nomor pesanan tidak valid.';else{
const {data:o,error}=await db.from('jt_orders').select('id,user_id,exam_id,subtotal,discount,admin_fee,total,status,created_at,proof_path').eq('id',orderId).maybeSingle();
if(error||!o){$('state').textContent='Pesanan tidak ditemukan atau Anda tidak memiliki akses.';}else{
const {data:exam}=await db.from('jt_exams').select('title').eq('id',o.exam_id).maybeSingle();$('detail').hidden=false;$('orderId').textContent=o.id;$('created').textContent=new Date(o.created_at).toLocaleString('id-ID');$('exam').textContent=exam?.title||'Paket Tryout';$('subtotal').textContent=money(o.subtotal);$('discount').textContent='−'+money(o.discount);$('fee').textContent=money(o.admin_fee);$('total').textContent=money(o.total);
const statuses={pending:'Menunggu transfer',awaiting_review:'Menunggu verifikasi pengelola',approved:'Terverifikasi / paket aktif',rejected:'Bukti ditolak — unggah kembali'};$('state').textContent=statuses[o.status]||o.status;$('notice').textContent=o.status==='approved'?'Pesanan telah dikonfirmasi. Simpan struk ini sebagai bukti.':o.total===0?'Klaim sedang diproses.':'Struk ini adalah bukti pengajuan pesanan, bukan bukti pembayaran lunas. Paket aktif setelah pengelola menyetujui transfer.';$('proofForm').hidden=!(o.total>0&&['pending','rejected'].includes(o.status));
$('proofForm').onsubmit=async ev=>{ev.preventDefault();const file=$('proof').files[0];if(!file||file.size>5242880||!['image/jpeg','image/png','application/pdf'].includes(file.type)){$('feedback').textContent='Pilih JPG, PNG, atau PDF maksimal 5 MB.';return;}const btn=$('proofForm').querySelector('button');btn.disabled=true;$('feedback').textContent='Mengunggah...';const ext=file.type==='application/pdf'?'pdf':file.type==='image/png'?'png':'jpg',path=session.user.id+'/'+o.id+'/'+crypto.randomUUID()+'.'+ext;const {error:uploadError}=await db.storage.from('jt-payment-proofs').upload(path,file,{contentType:file.type,upsert:false});if(uploadError){$('feedback').textContent=uploadError.message;btn.disabled=false;return;}const {error:submitError}=await db.rpc('jt_submit_proof',{p_order_id:o.id,p_path:path});if(submitError){$('feedback').textContent=submitError.message;btn.disabled=false;return;}location.reload()};
}}
